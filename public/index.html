<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #212121;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
}

header {
  height: 60px;
  padding: 18px;
  border-bottom: 1px solid #444;
  font-size: 20px;
  font-weight: bold;
}

#chat {
  height: calc(100vh - 130px);
  overflow-y: auto;
  padding: 15px;
}

.message {
  max-width: 800px;
  margin: 12px auto;
  padding: 14px;
  border-radius: 12px;
  white-space: pre-wrap;
  line-height: 1.5;
}

.user {
  background: #343541;
}

.ai {
  background: #2b2b2b;
}

.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #212121;
  padding: 10px;
  border-top: 1px solid #444;
}

.box {
  max-width: 800px;
  margin: auto;
  display: flex;
  gap: 8px;
}

textarea {
  flex: 1;
  height: 52px;
  resize: none;
  border: 1px solid #555;
  border-radius: 12px;
  background: #303030;
  color: white;
  padding: 14px;
  font-size: 16px;
  outline: none;
}

button {
  width: 58px;
  border: none;
  border-radius: 12px;
  background: #10a37f;
  color: white;
  font-size: 20px;
}
</style>
</head>

<body>

<header>🤖 SK Chat</header>

<div id="chat">
  <div class="message ai">
    नमस्कार! 👋 मी SK Chat आहे. मला काहीही विचार.
  </div>
</div>

<div class="input-area">
  <div class="box">

    <textarea
      id="message"
      placeholder="Message SK Chat..."
      onkeydown="handleKey(event)">
    </textarea>

    <button onclick="sendMessage()">➤</button>

  </div>
</div>

<script>

function handleKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {

  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  addMessage("You", text, "user");

  input.value = "";

  const loading = addMessage(
    "SK Chat",
    "Thinking...",
    "ai"
  );

  try {

    const response = await fetch("/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    loading.textContent =
      "SK Chat\n" +
      (data.reply || data.error || "No response");

  } catch (error) {

    loading.textContent =
      "SK Chat\nServer connect झाला नाही.";

  }
}

function addMessage(name, text, type) {

  const message = document.createElement("div");

  message.className =
    "message " + type;

  message.textContent =
    name + "\n" + text;

  document.getElementById("chat")
    .appendChild(message);

  document.getElementById("chat")
    .scrollTop =
    document.getElementById("chat").scrollHeight;

  return message;
}

</script>

</body>
  </html>
